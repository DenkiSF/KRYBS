# config.example.toml — Пример конфигурации KRYBS
#
# Скопируйте этот файл в один из стандартных путей поиска:
#   /etc/krybs/config.toml          (системная конфигурация)
#   ~/.config/krybs/config.toml     (пользовательская конфигурация)
#   ./config.toml                   (конфигурация текущего каталога)
#
# Либо укажите путь явно: krybs --config /path/to/config.toml <команда>

# =============================================================================
# [core] — Основные настройки
# =============================================================================

[core]

# Каталог для хранения резервных копий.
# ОБЯЗАТЕЛЬНО абсолютный путь — относительные пути отклоняются валидацией.
backup_dir = "/var/backups/krybs"

# Каталог для временных файлов во время создания архива.
# Должен быть абсолютным путём.
temp_dir = "/tmp/krybs"

# Включить запись логов.
enable_logging = true

# Уровень детализации логов: "error", "warn", "info", "debug", "trace".
log_level = "info"

# Путь к файлу лога.
log_file = "/var/log/krybs.log"

# Максимальное количество файлов лога при ротации.
max_log_files = 5

# Максимальный размер одного файла лога в мегабайтах.
max_log_size = 100

# Сохранять незашифрованный архив, если шифрование завершилось ошибкой.
# false — удалять (рекомендуется), true — оставлять для диагностики.
keep_failed = false

# =============================================================================
# [crypto] — Настройки шифрования (Кузнечик, ГОСТ 34.12-2018)
# =============================================================================

[crypto]

# Путь к файлу мастер-ключа (256 бит, 32 байта).
# Сгенерировать: krybs keygen --output /etc/krybs/master.key
# Должен быть абсолютным путём.
master_key_path = "/etc/krybs/master.key"

# Удалять незашифрованный архив после успешного шифрования.
# true — рекомендуется для production.
delete_plain = true

# =============================================================================
# [maintenance] — Настройки автоматического обслуживания
# =============================================================================

[maintenance]

# Автоматически удалять резервные копии старше указанного числа дней.
# Применяется командой: krybs cleanup --max-age <N>d
max_age_days = 30

# Хранить не более N резервных копий.
# Применяется командой: krybs cleanup --keep-last <N>
max_backups = 10

# Проверять целостность резервных копий при запуске команды status.
check_integrity = true

# Уровень сжатия при переупаковке старых копий (0–9).
# Закомментируйте или удалите строку, чтобы отключить.
compress_old = 9

# =============================================================================
# [[profiles]] — Профили резервного копирования
#
# Каждый профиль описывает один набор путей для резервного копирования.
# Профилей может быть несколько — добавляйте блоки [[profiles]] по необходимости.
# Использование: krybs backup --profile <name>
# =============================================================================

[[profiles]]
# Уникальное имя профиля.
name = "system-etc"

# Список путей для резервного копирования (файлы или каталоги).
paths = ["/etc"]

# Шаблоны исключений (glob). Совпадающие файлы пропускаются.
exclude = ["*.tmp", "*.temp", "*.swp"]

# Шифровать резервную копию этого профиля.
encrypt = true

# Уровень сжатия (0 — без сжатия, 9 — максимальное, 6 — по умолчанию).
compression = 6

[[profiles]]
name = "home-docs"

paths = ["/home/user/Documents", "/home/user/Projects"]

exclude = [
    "*.tmp",
    "*.log",
    ".git/",
    "node_modules/",
    "target/",
    "__pycache__/",
]

encrypt = true
compression = 7

[[profiles]]
name = "postgres"

# Для PostgreSQL пути указывают на каталоги с данными СУБД.
# Для дампа используйте команду: krybs backup-postgres --dbname <db> --user postgres
paths = [
    "/var/lib/postgresql",
    "/etc/postgresql",
]

exclude = ["*.wal", "pg_wal/"]

encrypt = true
compression = 6

[[profiles]]
name = "nginx"

paths = [
    "/etc/nginx",
    "/var/log/nginx",
]

exclude = ["*.tmp", "access.log", "error.log"]

encrypt = true
compression = 5

[[profiles]]
name = "system-logs"

paths = ["/var/log"]

exclude = ["*.tmp", "*.temp", "journal/"]

# Логи обычно не содержат конфиденциальных данных.
encrypt = false
compression = 9
